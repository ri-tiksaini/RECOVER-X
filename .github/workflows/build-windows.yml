name: Build Portable Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Build Standalone RECOVER-X.exe
        shell: pwsh
        run: .\scripts\package_windows.ps1
      - name: Upload Portable Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: RECOVER-X-Portable-Windows
          path: dist/RECOVER-X-Portable-Windows/
